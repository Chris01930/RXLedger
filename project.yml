name: RxLedger
options:
  bundleIdPrefix: com.chrisnewell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: Z4K4WDMMZ6
targets:
  RxLedger:
    type: application
    platform: iOS
    sources:
      - path: RxLedger
    info:
      path: RxLedger/Info.plist
      properties:
        CFBundleDisplayName: RxLedger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: RxLedger uses the camera to scan your pharmacy labels. Images are processed on this device and never uploaded.
        NSFaceIDUsageDescription: RxLedger uses Face ID to keep your prescription history private.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisnewell.rxledger
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  RxLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Private/**"
    dependencies:
      - target: RxLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisnewell.rxledger.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RxLedger:
    build:
      targets:
        RxLedger: all
        RxLedgerTests: [test]
    test:
      targets:
        - RxLedgerTests
    run:
      config: Debug
